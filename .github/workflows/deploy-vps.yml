name: Build & Deploy to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Build production JAR
        run: mvn package -Pbase,production --no-transfer-progress

      - name: Copy JAR to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "target/deutsche-cards-app.jar"
          target: "/usr/apps/deutsch-cards-app"
          strip_components: 1

      - name: Execute deployment script on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_BOT_TOKEN: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
          VPS_DB_PASS: ${{ secrets.VPS_DB_PASS }}
          MINIAPP_URL: ${{ secrets.MINIAPP_URL }}
          APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
          GOOGLE_AI_API_KEY: ${{secrets.GOOGLE_AI_API_KEY}}
          PG_DATABASE_NAME: ${{ secrets.PG_DATABASE_NAME }}
          PG_PORT: ${{ secrets.PG_PORT }}
          PG_USERNAME: ${{ secrets.PG_USERNAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_ADMIN_BOT_TOKEN,VPS_DB_PASS,MINIAPP_URL,APP_PUBLIC_URL,GOOGLE_AI_API_KEY,PG_DATABASE_NAME,PG_PORT,PG_USERNAME
          script: |
            # Create directory if it doesn't exist
            mkdir -p /usr/apps/deutsch-cards-app
            cd /usr/apps/deutsch-cards-app

            # Настройки подключения к базе
            DB_HOST="localhost"
            DB_PORT="$PG_PORT"
            DB_NAME="$PG_DATABASE_NAME"
            DB_USER="$PG_USERNAME"

            # Путь к jar-файлу
            JAR_FILE="deutsche-cards-app.jar"

            # Ищем PID запущенного приложения
            PID=$(ps -ef | grep "$JAR_FILE" | grep -v grep | awk '{print $2}')

            if [ -n "$PID" ]; then
              echo "Останавливаю запущенное приложение (PID=$PID)..."
              kill "$PID"
              sleep 5
              # Проверяем, остановилось ли приложение, если нет - убиваем принудительно
              if ps -p $PID > /dev/null; then
                echo "Приложение не остановилось, использую kill -9..."
                kill -9 $PID
              fi
            else
              echo "Приложение не запущено."
            fi

            echo "Запускаю приложение..."

            # Запуск с параметрами базы данных
            nohup java -jar "$JAR_FILE" \
              --spring.datasource.url=jdbc:postgresql://$DB_HOST:$DB_PORT/$DB_NAME \
              --spring.datasource.username=$DB_USER \
              --spring.datasource.password=$VPS_DB_PASS \
              --spring.profiles.active=prod \
              --server.port=8180 \
              --telegram.bot.token=$TELEGRAM_BOT_TOKEN \
              --admin.bot.enabled=true \
              --admin.bot.token=$TELEGRAM_ADMIN_BOT_TOKEN \
              --miniapp.url=$MINIAPP_URL \
              --app.public-url=$APP_PUBLIC_URL \
              --spring.ai.google.genai.api-key=$GOOGLE_AI_API_KEY \
              > app.log 2>&1 &

            echo "Приложение запущено. Проверяю статус..."
            sleep 3
            if ps -ef | grep "$JAR_FILE" | grep -v grep > /dev/null; then
              echo "Приложение успешно стартовало."
            else
              echo "Ошибка при запуске приложения. Проверьте app.log"
              tail -n 100 app.log
              exit 1
            fi
