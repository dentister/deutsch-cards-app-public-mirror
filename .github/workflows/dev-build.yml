name: Build & Test

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'refactor/**'

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Cache Vaadin frontend dependencies
        uses: actions/cache@v4
        with:
          path: core/node_modules
          key: vaadin-node-modules-${{ hashFiles('core/package-lock.json') }}

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(mvn -q -B -ntp help:evaluate -Dexpression=playwright.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright OS dependencies
        run: npx --yes playwright@${{ steps.playwright.outputs.version }} install-deps chromium

      - name: Compile
        run: mvn -B -ntp clean compile test-compile

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
