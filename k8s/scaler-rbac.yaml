# ServiceAccount used by scale-up / scale-down CronJobs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scaler
  namespace: default

---

# Role: allow patching Deployments and StatefulSets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scaler-role
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch", "update"]

---

# Bind the role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scaler-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: scaler
    namespace: default
roleRef:
  kind: Role
  name: scaler-role
  apiGroup: rbac.authorization.k8s.io
