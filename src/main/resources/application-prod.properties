# Production (VPS) profile — bot + slim web server, WITHOUT Vaadin.
#
# The Telegram bot uses long-polling, but the "Specific words" Mini App needs an
# HTTP server to serve its static page and REST API, so we run a plain servlet
# container (Spring MVC) here. Vaadin — the heavy part (Tomcat+Atmosphere+push,
# large heap) that previously caused OOM on the small VPS — stays OFF via the
# auto-configure excludes below, keeping the web server lightweight.
#
# Vaadin's Spring auto-configuration is NOT web-conditional, so it must be
# excluded explicitly or it fails to initialise even with vaadin.enabled=false.
#
# Activated on the VPS via: --spring.profiles.active=prod,no-vaadin
# Dev (dev,no-vaadin) also runs servlet + no-Vaadin; GKE (production) keeps the Vaadin UI.
spring.main.web-application-type=servlet
spring.autoconfigure.exclude=\
  com.vaadin.flow.spring.SpringBootAutoConfiguration,\
  com.vaadin.flow.spring.SpringSecurityAutoConfiguration,\
  com.vaadin.flow.spring.VaadinScopesConfig,\
  com.vaadin.hilla.EndpointController,\
  com.vaadin.hilla.push.PushConfigurer,\
  com.vaadin.hilla.ApplicationContextProvider,\
  com.vaadin.hilla.startup.EndpointRegistryInitializer,\
  com.vaadin.hilla.startup.RouteUnifyingServiceInitListener,\
  com.vaadin.hilla.route.RouteUtil,\
  com.vaadin.hilla.route.RouteUnifyingConfiguration,\
  com.vaadin.hilla.signals.config.SignalsConfiguration
