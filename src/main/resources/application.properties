spring.profiles.active=dev,no-vaadin
vaadin.devmode.hosts-allowed=devserver.endpoint=127.0.0.1

spring.datasource.url=jdbc:postgresql://localhost:5432/words-db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres


spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.pool-name=ConnPool
spring.datasource.hikari.connection-test-query=select 1

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.default_schema=public 

spring.liquibase.change-log=classpath:db/liquibase-changelog.xml
spring.liquibase.default-schema=public

server.port=8080

#spring.devtools.restart.poll-interval=2s
#spring.devtools.restart.quiet-period=1s


vaadin.frontend.hotdeploy=false
vaadin.url-mapping=/*
vaadin.exclude-urls=/swagger-ui.html,/swagger-ui/**,/test,/api/**



# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true
# To improve the performance during development.
# For more information https://vaadin.com/docs/flow/spring/tutorial-spring-configuration.html#special-configuration-parameters
#vaadin.whitelisted-packages = com.vaadin,org.vaadin,dev.hilla,com.example.application
#spring.jpa.defer-datasource-initialization = true
#spring.sql.init.mode = always

springdoc.api-docs.path=/swagger-ui/api-docs


#logging.level.com.zaxxer.hikari=debug
#logging.level.org.springframework=debug
#logging.level.org.hibernate=debug
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

telegram.bot.username=GermanCardsBot
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

# Public HTTPS URL of the "Specific words" Mini App page (e.g. https://<domain>/miniapp/).
# Empty by default; set via MINIAPP_URL env var or --miniapp.url=... on deploy.
miniapp.url=${MINIAPP_URL:}

# Compress the ~1 MB word catalog JSON served to the Mini App.
server.compression.enabled=true
server.compression.mime-types=application/json,text/css,application/javascript
server.compression.min-response-size=1024

# --- Spring AI (Google Gemini, free Developer API tier) ---
# Get a free key at https://aistudio.google.com/apikey (no credit card).
# Do NOT set spring.ai.google.genai.project-id or .location - that switches the client
# into paid Vertex AI mode and the free Developer API key gets rejected with a 400.
spring.ai.google.genai.api-key=${GOOGLE_AI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1000

# --- Admin Telegram bot (AI-drafted word add/edit; single admin, no moderation queue) ---
# Separate bot/token from telegram.bot.token above - register @GermanCardsAdminBot with
# BotFather, set TELEGRAM_ADMIN_BOT_TOKEN via env var, THEN flip admin.bot.enabled to true
# (defaults to false - an empty token would otherwise make the app fail to start, since the
# Telegram starter tries to register every bot with Telegram at boot).
admin.bot.enabled=${ADMIN_BOT_ENABLED:true}
admin.bot.token=${TELEGRAM_ADMIN_BOT_TOKEN:}
admin.bot.allowed-username=${ADMIN_TELEGRAM_USERNAME:mr_dentister}
