spring.profiles.active=dev,no-vaadin
vaadin.devmode.hosts-allowed=devserver.endpoint=127.0.0.1

spring.datasource.url=jdbc:postgresql://localhost:5432/words-db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.pool-name=ConnPool
spring.datasource.hikari.connection-test-query=select 1

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.default_schema=public 

spring.liquibase.change-log=classpath:db/liquibase-changelog.xml
spring.liquibase.default-schema=public

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

server.port=8080

vaadin.frontend.hotdeploy=false
vaadin.url-mapping=/*
vaadin.exclude-urls=/swagger-ui.html,/swagger-ui/**,/test,/api/**,/miniapp,/miniapp/**,/telegram-login/**

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

springdoc.api-docs.path=/swagger-ui/api-docs

telegram.bot.username=GermanCardsBot
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

admin.bot.enabled=${ADMIN_BOT_ENABLED:true}
admin.bot.token=${TELEGRAM_ADMIN_BOT_TOKEN:}

telegram.login.max-age-seconds=60

# Default: https://germancards.run.place/miniapp/
miniapp.url=${MINIAPP_URL:}

# Default: https://germancards.run.place
app.public-url=${APP_PUBLIC_URL:}

# Compress the ~1 MB word catalog JSON served to the Mini App.
server.compression.enabled=true
server.compression.mime-types=application/json,text/css,application/javascript
server.compression.min-response-size=1024


spring.ai.google.genai.api-key=${GOOGLE_AI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1000

word.job.enabled=${WORD_JOB_ENABLED:true}
word.job.pause-seconds=10
word.job.daily-budget=400
# pause after an HTTP 429 (until midnight Pacific time if most of the daily budget is already used)
word.job.quota-backoff-minutes=30
word.job.initial-delay-seconds=60


