bot.welcome=*Willkommen beim German Cards Bot!*\n\nDieser Bot hilft dir, deutsche Wörter mit russischer Übersetzung zu lernen.\n\nSo funktioniert es:\n- der Bot zeigt ein Wort auf Russisch, und du schreibst die passende deutsche Form (Übersetzung, Plural, Verbkonjugation usw.);\n- nach deiner Antwort siehst du Hinweise und einen Beispielsatz zur Verwendung des Wortes.\n- nach einer Runde bekommst du vielleicht eine Bonus-Blitzrunde angeboten: übersetze 3 kurze Sätze aus den gerade geübten Wörtern und erhalte sofort Feedback.\n\nBefehle:\n*/restart* - Spiel neu starten\n*/setwords* - bestimmte Wörter zum Lernen auswählen (Mini-App)\n*/clearwords* - wieder alle Wörter üben\n*/setlevel* - maximales Wortniveau festlegen (A1-C2)\n*/switchpreview* - Vorschau der neuen Wörter vor jeder Runde ein-/ausschalten\n\nViel Erfolg beim Deutschlernen! 🎯
