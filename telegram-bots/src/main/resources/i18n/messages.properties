bot.welcome=*Welcome to German Cards Bot!*\n\nThis bot helps you learn German vocabulary. Prompts are shown in Russian and answered in German - English translations and example sentences are added gradually as you play, so you can follow along even without knowing Russian yet.\n\nHow it works:\n- the bot shows a word in Russian, and you type the matching German form (translation, plural, verb conjugation, etc.);\n- after answering, you'll see hints and an example sentence, with German, Russian and (once generated) English versions.\n- when a round finishes, you may be offered a bonus AI blitz round: translate 3 short sentences built from the words you just practiced and get instant feedback.\n\nCommands:\n*/restart* - restart the game\n*/setwords* - choose specific words to study (via the Mini App)\n*/clearwords* - go back to studying all words\n*/setlevel* - set the maximum word difficulty level (A1-C2)\n*/switchpreview* - toggle the new-words preview shown before each round\n*/website* - get your web app link and login\n\nGood luck learning German! 🎯
