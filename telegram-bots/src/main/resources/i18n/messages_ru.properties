bot.welcome=*Добро пожаловать в German Cards Bot!* 🇩🇪\n\nЭтот бот поможет выучить немецкие слова с переводом на русский.\n\nКак это работает:\n- бот показывает слово по-русски, а нужно написать подходящую немецкую форму (перевод, множественное число, спряжение глагола и т.д.);\n- после ответа появятся подсказки и пример использования слова в предложении.\n- по завершении раунда бот может предложить бонусный блиц-раунд: переведите 3 коротких предложения из слов, которые вы только что практиковали, и получите мгновенную обратную связь.\n\nКоманды бота:\n*/restart* - начать игру заново\n*/setwords* - выбрать конкретные слова для изучения (через мини-приложение)\n*/clearwords* - вернуться к изучению всех слов\n*/setlevel* - задать максимальный уровень сложности слов (A1-C2)\n*/switchpreview* - включить/выключить показ списка новых слов перед игрой\n*/website* - получить ссылку и логин для веб-версии\n\nУдачи в изучении немецкого! 🎯
